name: Build

# Deux raisons d'exister :
#  1. compiler l'application sur Windows, ce qu'aucun poste Linux ne peut faire —
#     c'est le SEUL endroit où le transport d'impression via le spouleur Windows
#     est réellement compilé ;
#  2. produire les installeurs sans dépendre de la machine d'un développeur.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rapide et indépendant de la plateforme : inutile de mobiliser deux runners
  # pour découvrir qu'un test échoue.
  verify:
    name: Types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Aucune version ici : elle est déclarée une seule fois, dans le champ
      # `packageManager` de package.json. La donner aux deux endroits fait
      # échouer l'action sur « Multiple versions of pnpm specified ».
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caisse/shared build
      # Le client Prisma est ENGENDRÉ, pas versionné : sans cette étape, le
      # typage de l'API ne connaît aucun de ses modèles. Aucune base n'est
      # nécessaire — `generate` ne lit que le schéma.
      - run: pnpm --filter @caisse/api exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm exec prettier --check .

  # Le code Rust porte l'authentification du serveur de salle et la
  # vérification du PIN : ses tests doivent tourner à chaque poussée, pas
  # seulement sur le poste de développement.
  rust:
    name: Tests Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo test --lib
        working-directory: apps/desktop/src-tauri

  # Les cinq parcours de bout en bout — 162 vérifications — ne tournaient
  # jusqu'ici que si un développeur y pensait. Ce sont pourtant les seuls tests
  # qui éprouvent l'API RÉELLE : multi-tenant, RLS, idempotence du push,
  # arbitrage des conflits. Un test qu'on oublie de lancer ne protège rien.
  parcours-api:
    name: Parcours d'API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caisse
          POSTGRES_PASSWORD: caisse
          POSTGRES_DB: caisse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caisse -d caisse"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Deux rôles, comme en production : les migrations appartiennent au
      # propriétaire, l'API tourne sous un rôle ordinaire soumis à la RLS.
      # Employer le même rôle pour les deux rendrait le cloisonnement
      # décoratif — et ces parcours le vérifient précisément.
      DIRECT_DATABASE_URL: postgresql://caisse:caisse@localhost:5432/caisse?schema=public
      DATABASE_URL: postgresql://caisse_app:caisse_app@localhost:5432/caisse?schema=public
      JWT_ACCESS_SECRET: secret-de-test-sans-valeur-aucune
      JWT_REFRESH_SECRET: autre-secret-de-test-sans-valeur
      NODE_ENV: development
      API_PORT: 3000
      API_URL: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caisse/shared build
      - run: pnpm --filter @caisse/api exec prisma generate

      # `migrate deploy` et non `migrate dev` : on applique les migrations
      # telles qu'elles sont versionnées, sans jamais en engendrer une nouvelle.
      # C'est exactement ce que fera la mise en production.
      - run: pnpm --filter @caisse/api exec prisma migrate deploy

      - run: pnpm --filter @caisse/api build

      - name: Démarrer l'API
        working-directory: apps/api
        run: |
          # Démarrée depuis apps/api, comme en production : c'est de là que se
          # résolvent `@caisse/shared` et le client Prisma engendré.
          node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API prête"; exit 0
            fi
            sleep 1
          done
          echo "::error::l'API n'a pas démarré en 30 s"
          cat /tmp/api.log
          exit 1

      # Chaque parcours s'exécute même si le précédent échoue : découvrir les
      # cinq problèmes d'un coup vaut mieux que les découvrir un par jour.
      - name: Authentification, rôles, multi-tenant
        run: bash apps/api/test/auth-flow.sh
      - name: Catalogue et stock
        if: '!cancelled()'
        run: bash apps/api/test/catalog-flow.sh
      - name: Synchronisation — fusion, conflits, idempotence
        if: '!cancelled()'
        run: bash apps/api/test/sync-flow.sh
      - name: Vente complète — ticket, TVA, stock, rejeu
        if: '!cancelled()'
        run: bash apps/api/test/sale-flow.sh
      - name: Journée, remboursement, clôture
        if: '!cancelled()'
        run: bash apps/api/test/reports-flow.sh

      - name: Arrêter l'API
        if: always()
        run: kill "$(cat /tmp/api.pid)" || true

  # L'image du serveur est construite à chaque poussée, sans être publiée : une
  # erreur de Dockerfile doit se voir ici, pas le soir d'une mise en production.
  image-serveur:
    name: Image du serveur
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: caisse-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: caisse-windows
          - os: ubuntu-22.04
            label: Linux
            artifact: caisse-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Aucune version ici : elle est déclarée une seule fois, dans le champ
      # `packageManager` de package.json. La donner aux deux endroits fait
      # échouer l'action sur « Multiple versions of pnpm specified ».
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Le cache Rust divise le temps de build par cinq sur les exécutions
      # suivantes ; sans lui, chaque poussée recompile 400 caisses.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # WebKitGTK et les bibliothèques GTK ne sont pas préinstallées sur les
      # runners Ubuntu.
      - name: Dépendances système (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caisse/shared build

      - name: Compilation de l'application
        run: pnpm --filter @caisse/desktop tauri build
        env:
          # Signature des mises à jour. Sans ces secrets, la compilation réussit
          # mais ne produit AUCUN fichier .sig : les caisses installées
          # refuseront alors la mise à jour, car elles vérifient la signature
          # avant d'installer quoi que ce soit.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig

  release:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `pattern` est indispensable : sans lui, l'action récupère AUSSI
      # l'artefact de traçabilité produit par la construction de l'image Docker,
      # qu'elle ne sait pas extraire — et la publication échoue alors que les
      # deux installeurs sont prêts.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: caisse-*

      # Le manifeste que les caisses interrogent. Il porte les signatures des
      # installeurs : produit par script, jamais à la main.
      - name: Manifeste de mise à jour
        run: |
          node scripts/latest-json.mjs artifacts "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          # Brouillon volontaire : les installeurs ne sont pas signés, il faut
          # relire ce qu'on publie avant de l'exposer.
          body: |
            Installeurs Windows et Linux.

            Les caisses déjà installées verront cette version dans
            « Réglages → Mise à jour » dès que la publication ne sera plus un
            brouillon : `latest.json` n'est servi que par une version publiée.

            Si aucun fichier `latest.json` n'est joint, la clé de signature
            manque dans les secrets du dépôt : les caisses déjà installées ne
            verront pas cette version (cf. `docs/mises-a-jour.md`).

            ⚠️ Installeurs non signés par un certificat éditeur : Windows
            affichera un avertissement SmartScreen à la PREMIÈRE installation
            (« Plus d'infos » puis « Exécuter quand même »). Les mises à jour
            suivantes, elles, sont signées par la clé du projet et vérifiées
            par l'application.
