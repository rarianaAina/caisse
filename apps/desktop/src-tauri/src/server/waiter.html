<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Salle</title>
    <!--
      Page servie par la caisse aux téléphones des serveurs.

      Tout est dans ce fichier : aucun réseau extérieur n'est disponible dans un
      restaurant sans Internet, donc aucune police, aucun script, aucune image
      distante. C'est aussi ce qui permet à n'importe quel téléphone de
      l'ouvrir sans rien installer.

      Trois contraintes de service commandent toute la mise en page :
        1. elle est utilisée DEBOUT, d'une main, parfois les doigts mouillés →
           cibles d'au moins 48 px, rien d'important dans les coins hauts ;
        2. elle est lue en marchant → contraste fort, gros chiffres ;
        3. chaque appui doit répondre TOUT DE SUITE → l'article s'ajoute à
           l'écran avant la réponse du serveur, et se retire si elle échoue.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --nuit: #0b1220;
        --nuit-clair: #16203a;
        --encre: #0f172a;
        --gris: #64748b;
        --gris-clair: #94a3b8;
        --bord: #e2e8f0;
        --fond: #f1f5f9;
        --bleu: #2563eb;
        --bleu-sombre: #1d4ed8;
        --vert: #059669;
        --ambre: #d97706;
        --rouge: #dc2626;
        --rayon: 14px;
        --ombre: 0 1px 2px rgb(15 23 42 / 0.06), 0 1px 3px rgb(15 23 42 / 0.05);
        --ombre-haute: 0 12px 32px rgb(15 23 42 / 0.18);
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--fond);
        color: var(--encre);
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior-y: contain;
        font-variant-numeric: tabular-nums;
      }

      /* ─── Ossature ─────────────────────────────────────────────────────── */

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      header {
        background: var(--nuit);
        color: #fff;
        padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
      }
      header .titre {
        flex: 1;
        min-width: 0;
      }
      header h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .sous {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 2px;
      }

      main {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 14px 14px 20px;
      }

      /* ─── Boutons ──────────────────────────────────────────────────────── */

      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        cursor: pointer;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 52px;
        padding: 0 18px;
        border-radius: var(--rayon);
        font-weight: 650;
        font-size: 16px;
        background: #fff;
        border: 1px solid var(--bord);
        transition: transform 90ms ease;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-principal {
        background: var(--bleu);
        color: #fff;
        border-color: var(--bleu);
        box-shadow: 0 4px 14px rgb(37 99 235 / 0.3);
      }
      .btn-cuisine {
        background: var(--ambre);
        color: #fff;
        border-color: var(--ambre);
        box-shadow: 0 4px 14px rgb(217 119 6 / 0.3);
      }
      .btn:disabled {
        opacity: 0.4;
        box-shadow: none;
      }
      .btn-fantome {
        min-height: 40px;
        padding: 0 14px;
        font-size: 14px;
        background: rgb(255 255 255 / 0.1);
        border: 1px solid rgb(255 255 255 / 0.25);
        color: #fff;
      }

      /* ─── Salle ────────────────────────────────────────────────────────── */

      .grille-tables {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .table {
        background: #fff;
        border: 1px solid var(--bord);
        border-radius: var(--rayon);
        padding: 16px;
        box-shadow: var(--ombre);
        text-align: left;
        position: relative;
        overflow: hidden;
        transition: transform 90ms ease;
      }
      .table:active {
        transform: scale(0.97);
      }
      /* Un liseré coloré porte l'état : lisible de loin, sans lire le texte. */
      .table::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: var(--bord);
      }
      .table.occupee::before {
        background: var(--bleu);
      }
      .table.attente::before {
        background: var(--ambre);
      }
      .table .nom {
        font-size: 17px;
        font-weight: 700;
      }
      .table .montant {
        font-size: 22px;
        font-weight: 700;
        margin-top: 6px;
        letter-spacing: -0.02em;
      }
      .table .libre {
        color: var(--gris-clair);
        font-size: 14px;
        margin-top: 6px;
      }
      .table .meta {
        color: var(--gris);
        font-size: 13px;
        margin-top: 2px;
      }

      /* ─── Catégories ───────────────────────────────────────────────────── */

      .categories {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 14px 12px;
        margin: 0 -14px;
        scrollbar-width: none;
      }
      .categories::-webkit-scrollbar {
        display: none;
      }
      .cat {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--bord);
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
      }
      .cat .point {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--gris-clair);
        flex: none;
      }
      .cat .compte {
        font-size: 12px;
        color: var(--gris);
        font-weight: 600;
      }
      .cat[aria-pressed='true'] {
        background: var(--encre);
        color: #fff;
        border-color: var(--encre);
      }
      .cat[aria-pressed='true'] .compte {
        color: #cbd5e1;
      }

      /* ─── Articles ─────────────────────────────────────────────────────── */

      .recherche {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      input[type='search'],
      input[type='text'],
      textarea {
        font: inherit;
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid var(--bord);
        border-radius: var(--rayon);
        background: #fff;
        -webkit-user-select: text;
        user-select: text;
      }
      input:focus,
      textarea:focus {
        outline: 2px solid var(--bleu);
        outline-offset: -1px;
      }

      .grille-articles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
      }
      .article {
        background: #fff;
        border: 1px solid var(--bord);
        border-left: 4px solid var(--bord);
        border-radius: var(--rayon);
        padding: 12px 12px 10px;
        text-align: left;
        box-shadow: var(--ombre);
        display: flex;
        flex-direction: column;
        min-height: 96px;
        transition: transform 90ms ease;
      }
      .article:active {
        transform: scale(0.96);
      }
      .article .nom {
        font-weight: 650;
        font-size: 15px;
        line-height: 1.3;
      }
      .article .decl {
        display: inline-block;
        margin-top: 4px;
        font-size: 12px;
        font-weight: 700;
        color: var(--bleu-sombre);
        background: #eff6ff;
        border-radius: 6px;
        padding: 1px 6px;
      }
      .article .desc {
        font-size: 12px;
        color: var(--gris);
        margin-top: 4px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .article .prix {
        margin-top: auto;
        padding-top: 8px;
        font-size: 17px;
        font-weight: 700;
      }
      .article .compteur {
        position: absolute;
      }
      .enveloppe-article {
        position: relative;
      }
      /* Nombre déjà commandé : évite de recompter la commande dans sa tête. */
      .badge-qte {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 26px;
        height: 26px;
        border-radius: 999px;
        background: var(--bleu);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgb(37 99 235 / 0.4);
      }

      /* ─── Commande ─────────────────────────────────────────────────────── */

      .service {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gris);
        margin: 18px 0 8px;
      }
      .ligne {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 1px solid var(--bord);
        border-radius: var(--rayon);
        padding: 12px;
        margin-bottom: 8px;
        box-shadow: var(--ombre);
      }
      .ligne .qte {
        min-width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--fond);
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .ligne .corps {
        flex: 1;
        min-width: 0;
      }
      .ligne .note {
        font-size: 13px;
        color: var(--ambre);
        font-weight: 600;
        margin-top: 2px;
      }
      .etat {
        font-size: 12px;
        font-weight: 700;
        margin-top: 2px;
      }
      .etat.parti {
        color: var(--ambre);
      }
      .etat.attente {
        color: var(--gris);
      }
      .etat.servi {
        color: var(--vert);
      }
      /* Bouton « servir » : la seule action qu'un serveur fait les mains
         pleines, donc large et éloignée du bouton de suppression. */
      .servir {
        min-width: 92px;
        min-height: 46px;
        border-radius: 12px;
        background: var(--vert);
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        flex: none;
      }
      .servi-fait {
        min-width: 92px;
        min-height: 46px;
        border-radius: 12px;
        background: #ecfdf5;
        color: var(--vert);
        font-weight: 700;
        font-size: 14px;
        flex: none;
      }
      .avancement {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0 8px;
      }
      .barre-fond {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: var(--bord);
        overflow: hidden;
      }
      .barre-part {
        height: 100%;
        background: var(--vert);
        transition: width 200ms ease;
      }
      .actions-table {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 24px;
      }
      .actions-table .btn {
        min-height: 48px;
        font-size: 15px;
      }
      .danger {
        color: var(--rouge);
        border-color: #fecaca;
        background: #fef2f2;
      }
      .supprimer {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        color: var(--gris-clair);
        font-size: 20px;
        flex: none;
      }

      /* ─── Barre du bas ─────────────────────────────────────────────────── */

      .barre {
        flex: none;
        background: #fff;
        border-top: 1px solid var(--bord);
        padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px);
        display: flex;
        gap: 10px;
        align-items: center;
        box-shadow: 0 -4px 16px rgb(15 23 42 / 0.06);
      }
      .barre .total {
        flex: 1;
      }
      .barre .total .libelle {
        font-size: 12px;
        color: var(--gris);
        font-weight: 600;
      }
      .barre .total .valeur {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .onglets {
        display: flex;
        gap: 4px;
        background: rgb(255 255 255 / 0.12);
        padding: 4px;
        border-radius: 999px;
      }
      .onglets button {
        min-height: 36px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 650;
        color: #cbd5e1;
      }
      .onglets button[aria-pressed='true'] {
        background: #fff;
        color: var(--encre);
      }

      /* ─── Fiche d'ajout ────────────────────────────────────────────────── */

      .voile {
        position: fixed;
        inset: 0;
        background: rgb(15 23 42 / 0.5);
        display: flex;
        align-items: flex-end;
        z-index: 20;
      }
      .fiche {
        background: #fff;
        width: 100%;
        border-radius: 20px 20px 0 0;
        padding: 20px 16px calc(env(safe-area-inset-bottom) + 16px);
        box-shadow: var(--ombre-haute);
        max-height: 88vh;
        overflow-y: auto;
      }
      .poignee {
        width: 40px;
        height: 4px;
        border-radius: 999px;
        background: var(--bord);
        margin: -8px auto 14px;
      }
      .pas {
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: center;
        margin: 14px 0;
      }
      .pas button {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--fond);
        font-size: 26px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pas .valeur {
        font-size: 32px;
        font-weight: 750;
        min-width: 64px;
        text-align: center;
      }
      .choix {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .choix button {
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid var(--bord);
        font-weight: 650;
        background: #fff;
      }
      .choix button[aria-pressed='true'] {
        background: var(--encre);
        color: #fff;
        border-color: var(--encre);
      }

      /* ─── Connexion ────────────────────────────────────────────────────── */

      .clavier {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        max-width: 320px;
        margin: 0 auto;
      }
      .clavier button {
        min-height: 68px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid var(--bord);
        font-size: 26px;
        font-weight: 650;
        box-shadow: var(--ombre);
      }
      .clavier button:active {
        background: var(--fond);
      }
      .points {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 26px 0;
      }
      .points i {
        width: 15px;
        height: 15px;
        border-radius: 999px;
        background: var(--bord);
        transition: background 120ms ease;
      }
      .points i.plein {
        background: var(--bleu);
      }
      .personne {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        background: #fff;
        border: 1px solid var(--bord);
        border-radius: var(--rayon);
        padding: 14px 16px;
        margin-bottom: 10px;
        box-shadow: var(--ombre);
        font-size: 17px;
        font-weight: 600;
        text-align: left;
      }
      .initiale {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: var(--nuit);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex: none;
      }

      /* ─── Divers ───────────────────────────────────────────────────────── */

      .vide {
        text-align: center;
        color: var(--gris);
        padding: 48px 20px;
        font-size: 15px;
      }
      .alerte {
        position: fixed;
        left: 14px;
        right: 14px;
        bottom: calc(env(safe-area-inset-bottom) + 90px);
        background: var(--rouge);
        color: #fff;
        padding: 14px 16px;
        border-radius: var(--rayon);
        font-weight: 600;
        box-shadow: var(--ombre-haute);
        z-index: 30;
      }
      .alerte.succes {
        background: var(--vert);
      }
      .cache {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <button id="retour" class="btn-fantome cache" type="button">‹ Retour</button>
        <div class="titre">
          <h1 id="titre">Salle</h1>
          <div class="sous" id="sous"></div>
        </div>
        <div class="onglets cache" id="onglets">
          <button type="button" data-vue="carte" aria-pressed="true">Carte</button>
          <button type="button" data-vue="commande" aria-pressed="false">Commande</button>
        </div>
      </header>

      <main id="ecran"></main>
      <div class="barre cache" id="barre"></div>
    </div>

    <script>
      'use strict';

      const etat = {
        token: null,
        nom: null,
        table: null,
        orderId: null,
        vue: 'carte',
        categorie: '',
        recherche: '',
        categories: [],
        articles: [],
        lignes: [],
        pin: '',
      };

      const $ = (id) => document.getElementById(id);
      const ecran = $('ecran');
      const barre = $('barre');
      // Liste fermée, identique à celle de la caisse : en plein service, une
      // zone de texte donne « ras », et la trace ne vaut plus rien ensuite.
      const MOTIFS = [
        { valeur: 'paid', nom: 'Addition réglée' },
        { valeur: 'left', nom: 'Client parti' },
        { valeur: 'mistake', nom: 'Erreur de saisie' },
        { valeur: 'moved', nom: 'Clients changés de table' },
        { valeur: 'offered', nom: 'Offert par la maison' },
        { valeur: 'end_service', nom: 'Fin de service' },
      ];
      const SERVICES = [
        { valeur: 1, nom: 'Entrée' },
        { valeur: 2, nom: 'Plat' },
        { valeur: 3, nom: 'Dessert' },
      ];

      /** Les montants sont des entiers d'ariary : aucune décimale à afficher. */
      const argent = (cents) => new Intl.NumberFormat('fr-FR').format(cents);
      const echapper = (texte) =>
        String(texte ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );

      function message(texte, succes = false) {
        document.querySelectorAll('.alerte').forEach((n) => n.remove());
        const bloc = document.createElement('div');
        bloc.className = 'alerte' + (succes ? ' succes' : '');
        bloc.textContent = texte;
        document.body.append(bloc);
        setTimeout(() => bloc.remove(), 3500);
      }

      async function api(chemin, options = {}) {
        const reponse = await fetch(chemin, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(etat.token ? { Authorization: 'Bearer ' + etat.token } : {}),
          },
        });
        if (reponse.status === 401) {
          // Session expirée : on repart de l'écran de connexion plutôt que
          // d'afficher une erreur incompréhensible en plein service.
          etat.token = null;
          connexion();
          throw new Error('Session expirée');
        }
        if (!reponse.ok) throw new Error((await reponse.text()) || 'Erreur');
        return reponse.json();
      }

      /* ─── Connexion ──────────────────────────────────────────────────── */

      async function connexion() {
        etat.token = null;
        $('retour').classList.add('cache');
        $('onglets').classList.add('cache');
        barre.classList.add('cache');
        $('titre').textContent = 'Service';
        $('sous').textContent = 'Qui prend la salle ?';

        let personnes = [];
        try {
          personnes = await (await fetch('/api/staff')).json();
        } catch {
          ecran.innerHTML = '<p class="vide">Caisse injoignable. Vérifiez le Wi-Fi.</p>';
          return;
        }

        if (personnes.length === 0) {
          ecran.innerHTML =
            '<p class="vide">Aucun compte avec code PIN sur cette caisse.<br>Créez les comptes des serveurs depuis la caisse.</p>';
          return;
        }

        ecran.innerHTML = '';
        for (const personne of personnes) {
          const bouton = document.createElement('button');
          bouton.className = 'personne';
          bouton.type = 'button';
          bouton.innerHTML =
            '<span class="initiale">' +
            echapper((personne.name || '?').trim().charAt(0).toUpperCase()) +
            '</span><span>' +
            echapper(personne.name) +
            '</span>';
          bouton.onclick = () => saisiePin(personne);
          ecran.append(bouton);
        }
      }

      function saisiePin(personne) {
        etat.pin = '';
        $('titre').textContent = personne.name;
        $('sous').textContent = 'Votre code PIN';
        $('retour').classList.remove('cache');
        $('retour').onclick = connexion;

        ecran.innerHTML =
          '<div class="points" id="points"></div><div class="clavier" id="clavier"></div>';

        const points = $('points');
        const dessine = () => {
          points.innerHTML = '';
          // Quatre points minimum, puis un par chiffre : le serveur voit ce
          // qu'il a tapé sans que le code s'affiche.
          const total = Math.max(4, etat.pin.length);
          for (let i = 0; i < total; i += 1) {
            const point = document.createElement('i');
            if (i < etat.pin.length) point.className = 'plein';
            points.append(point);
          }
        };
        dessine();

        const clavier = $('clavier');
        for (const touche of ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓']) {
          const bouton = document.createElement('button');
          bouton.type = 'button';
          bouton.textContent = touche;
          if (touche === '✓') {
            bouton.style.background = 'var(--bleu)';
            bouton.style.color = '#fff';
            bouton.style.borderColor = 'var(--bleu)';
          }
          bouton.onclick = async () => {
            if (touche === '⌫') etat.pin = etat.pin.slice(0, -1);
            else if (touche === '✓') {
              await connecter(personne, false, dessine);
              return;
            } else if (etat.pin.length < 8) etat.pin += touche;
            dessine();
          };
          clavier.append(bouton);
        }
      }

      /**
       * Ouvre la session, en gérant le compte déjà ouvert ailleurs.
       *
       * Un compte, un appareil : deux serveurs sous le même nom, ce sont deux
       * commandes prises au même nom, et la traçabilité disparaît là où elle
       * protège le patron. La reprise reste possible — un téléphone en panne de
       * batterie bloquerait sinon le compte douze heures — mais elle est
       * explicite et déconnecte l'autre appareil.
       */
      async function connecter(personne, takeover, dessine) {
        try {
          const session = await api('/api/session', {
            method: 'POST',
            body: JSON.stringify({ user_id: personne.id, pin: etat.pin, takeover }),
          });
          etat.token = session.token;
          etat.nom = session.name;
          salle();
        } catch (cause) {
          const texte = String(cause.message || cause);
          if (texte.includes('autre appareil')) {
            if (confirm(texte + '\n\nSe connecter ici et déconnecter l’autre appareil ?')) {
              await connecter(personne, true, dessine);
              return;
            }
          } else {
            message(texte);
          }
          etat.pin = '';
          dessine();
        }
      }

      /* ─── Salle ──────────────────────────────────────────────────────── */

      async function salle() {
        etat.orderId = null;
        etat.table = null;
        $('retour').classList.add('cache');
        $('onglets').classList.add('cache');
        barre.classList.add('cache');
        $('titre').textContent = 'Salle';
        $('sous').textContent = etat.nom;

        const tables = await api('/api/tables');
        const occupees = tables.filter((t) => t.orderId).length;
        $('sous').textContent = etat.nom + ' · ' + occupees + '/' + tables.length + ' occupées';

        if (tables.length === 0) {
          ecran.innerHTML = '<p class="vide">Aucune table configurée sur la caisse.</p>';
          return;
        }

        const grille = document.createElement('div');
        grille.className = 'grille-tables';

        for (const table of tables) {
          const bouton = document.createElement('button');
          bouton.type = 'button';
          bouton.className =
            'table' +
            (table.orderId
              ? table.pending || table.awaiting
                ? ' occupee attente'
                : ' occupee'
              : '');
          bouton.innerHTML = table.orderId
            ? '<div class="nom">' +
              echapper(table.name) +
              '</div><div class="montant">' +
              argent(table.dueCents) +
              '</div><div class="meta">' +
              (table.pending
                ? '○ ' + table.pending + ' à envoyer'
                : table.awaiting
                  ? '◐ ' + table.awaiting + ' à servir'
                  : '● tout servi') +
              '</div>'
            : '<div class="nom">' +
              echapper(table.name) +
              '</div><div class="libre">Libre · ' +
              table.seats +
              ' couverts</div>';
          bouton.onclick = () => ouvrir(table);
          grille.append(bouton);
        }

        ecran.innerHTML = '';
        ecran.append(grille);
      }

      async function ouvrir(table) {
        try {
          const reponse = table.orderId
            ? { orderId: table.orderId }
            : await api('/api/orders', {
                method: 'POST',
                body: JSON.stringify({ table_id: table.id }),
              });
          etat.orderId = reponse.orderId;
          etat.table = table;
          etat.vue = 'carte';
          etat.categorie = '';
          etat.recherche = '';
          await chargerCommande();
          dessinerCommande();
        } catch (cause) {
          message(String(cause.message || cause));
        }
      }

      /* ─── Commande ───────────────────────────────────────────────────── */

      async function chargerCommande() {
        const [lignes, categories, articles] = await Promise.all([
          api('/api/orders/' + etat.orderId + '/items'),
          api('/api/categories'),
          api('/api/products'),
        ]);
        etat.lignes = lignes;
        etat.categories = categories;
        etat.articles = articles;
      }

      async function rechargerArticles() {
        const params = new URLSearchParams();
        if (etat.recherche) params.set('q', etat.recherche);
        if (etat.categorie) params.set('category', etat.categorie);
        etat.articles = await api('/api/products?' + params.toString());
        dessinerCommande();
      }

      function totalCommande() {
        return etat.lignes.reduce(
          (somme, l) => somme + Math.round((l.unitPriceCents * l.qtyMilli) / 1000),
          0,
        );
      }

      function dessinerCommande() {
        $('titre').textContent = etat.table ? etat.table.name : 'Commande';
        const enAttente = etat.lignes.filter((l) => !l.sent).length;
        $('sous').textContent =
          etat.lignes.length + ' article' + (etat.lignes.length > 1 ? 's' : '');
        $('retour').classList.remove('cache');
        $('retour').onclick = salle;

        const onglets = $('onglets');
        onglets.classList.remove('cache');
        for (const bouton of onglets.querySelectorAll('button')) {
          bouton.setAttribute('aria-pressed', String(bouton.dataset.vue === etat.vue));
          bouton.onclick = () => {
            etat.vue = bouton.dataset.vue;
            dessinerCommande();
          };
        }

        etat.vue === 'carte' ? dessinerCarte() : dessinerLignes();

        // Barre du bas : le total à gauche, l'action du moment à droite.
        barre.classList.remove('cache');
        barre.innerHTML =
          '<div class="total"><div class="libelle">Total table</div><div class="valeur">' +
          argent(totalCommande()) +
          '</div></div>';

        const envoyer = document.createElement('button');
        envoyer.type = 'button';
        envoyer.className = 'btn btn-cuisine';
        envoyer.disabled = enAttente === 0;
        envoyer.textContent = enAttente === 0 ? 'Tout est envoyé' : 'Envoyer (' + enAttente + ')';
        envoyer.onclick = envoyerCuisine;
        barre.append(envoyer);
      }

      function dessinerCarte() {
        ecran.innerHTML = '';

        const recherche = document.createElement('div');
        recherche.className = 'recherche';
        recherche.innerHTML =
          '<input type="search" id="q" placeholder="Chercher un plat…" value="' +
          echapper(etat.recherche) +
          '" />';
        ecran.append(recherche);

        let minuteur;
        $('q').oninput = (event) => {
          clearTimeout(minuteur);
          etat.recherche = event.target.value;
          minuteur = setTimeout(() => void rechargerArticles(), 220);
        };

        // Catégories : c'est la couleur, pas le texte, qui sert de repère quand
        // on cherche « les boissons » en marchant.
        if (etat.categories.length > 0) {
          const bande = document.createElement('div');
          bande.className = 'categories';

          const tout = document.createElement('button');
          tout.type = 'button';
          tout.className = 'cat';
          tout.setAttribute('aria-pressed', String(etat.categorie === ''));
          tout.innerHTML = 'Tout <span class="compte">' + etat.articles.length + '</span>';
          tout.onclick = () => {
            etat.categorie = '';
            void rechargerArticles();
          };
          bande.append(tout);

          for (const categorie of etat.categories) {
            const bouton = document.createElement('button');
            bouton.type = 'button';
            bouton.className = 'cat';
            bouton.setAttribute('aria-pressed', String(etat.categorie === categorie.id));
            bouton.innerHTML =
              '<span class="point" style="background:' +
              echapper(categorie.color || '#94a3b8') +
              '"></span>' +
              echapper(categorie.name) +
              ' <span class="compte">' +
              categorie.count +
              '</span>';
            bouton.onclick = () => {
              etat.categorie = categorie.id;
              void rechargerArticles();
            };
            bande.append(bouton);
          }
          ecran.append(bande);
        }

        if (etat.articles.length === 0) {
          const vide = document.createElement('p');
          vide.className = 'vide';
          vide.textContent = 'Aucun article ne correspond.';
          ecran.append(vide);
          return;
        }

        const grille = document.createElement('div');
        grille.className = 'grille-articles';

        for (const article of etat.articles) {
          // Quantité déjà commandée : évite de recompter la commande de tête.
          const deja = etat.lignes
            .filter((l) => l.name === article.name)
            .reduce((somme, l) => somme + l.qtyMilli / 1000, 0);

          const enveloppe = document.createElement('div');
          enveloppe.className = 'enveloppe-article';

          const bouton = document.createElement('button');
          bouton.type = 'button';
          bouton.className = 'article';
          bouton.style.borderLeftColor = article.categoryColor || 'var(--bord)';
          bouton.innerHTML =
            '<div class="nom">' +
            echapper(article.name) +
            '</div>' +
            (article.variantLabel
              ? '<div><span class="decl">' + echapper(article.variantLabel) + '</span></div>'
              : '') +
            (article.description
              ? '<div class="desc">' + echapper(article.description) + '</div>'
              : '') +
            '<div class="prix">' +
            argent(article.priceCents) +
            '</div>';
          bouton.onclick = () => ficheAjout(article);
          enveloppe.append(bouton);

          if (deja > 0) {
            const badge = document.createElement('span');
            badge.className = 'badge-qte';
            badge.textContent = deja % 1 === 0 ? String(deja) : deja.toFixed(1);
            enveloppe.append(badge);
          }
          grille.append(enveloppe);
        }
        ecran.append(grille);
      }

      /**
       * Fiche d'ajout : quantité, service, note.
       *
       * Un appui direct ajouterait plus vite, mais « 3 cafés » et « sans
       * piment » sont trop fréquents pour obliger à revenir corriger ensuite.
       */
      function ficheAjout(article) {
        let quantite = 1;
        let service = 2;
        let note = '';

        const voile = document.createElement('div');
        voile.className = 'voile';
        voile.onclick = (event) => {
          if (event.target === voile) voile.remove();
        };

        const fiche = document.createElement('div');
        fiche.className = 'fiche';
        fiche.innerHTML =
          '<div class="poignee"></div>' +
          '<div style="font-size:20px;font-weight:700">' +
          echapper(article.name) +
          (article.variantLabel
            ? ' <span class="decl">' + echapper(article.variantLabel) + '</span>'
            : '') +
          '</div>' +
          '<div style="color:var(--gris);margin-top:4px">' +
          (article.categoryName ? echapper(article.categoryName) + ' · ' : '') +
          argent(article.priceCents) +
          '</div>' +
          (article.description
            ? '<div class="desc" style="margin-top:8px">' + echapper(article.description) + '</div>'
            : '') +
          '<div class="pas"><button type="button" id="moins">−</button>' +
          '<span class="valeur" id="qte">1</span>' +
          '<button type="button" id="plus">+</button></div>' +
          '<div class="choix" id="services"></div>' +
          '<input type="text" id="note" placeholder="Note : sans piment, à point…" />' +
          '<button type="button" class="btn btn-principal" id="ajouter" style="margin-top:14px">' +
          'Ajouter · <span id="montant">' +
          argent(article.priceCents) +
          '</span></button>';

        voile.append(fiche);
        document.body.append(voile);

        const majMontant = () => {
          fiche.querySelector('#qte').textContent = String(quantite);
          fiche.querySelector('#montant').textContent = argent(article.priceCents * quantite);
        };
        fiche.querySelector('#moins').onclick = () => {
          quantite = Math.max(1, quantite - 1);
          majMontant();
        };
        fiche.querySelector('#plus').onclick = () => {
          quantite += 1;
          majMontant();
        };

        const choix = fiche.querySelector('#services');
        for (const entree of SERVICES) {
          const bouton = document.createElement('button');
          bouton.type = 'button';
          bouton.textContent = entree.nom;
          bouton.setAttribute('aria-pressed', String(entree.valeur === service));
          bouton.onclick = () => {
            service = entree.valeur;
            for (const autre of choix.querySelectorAll('button')) {
              autre.setAttribute('aria-pressed', String(autre === bouton));
            }
          };
          choix.append(bouton);
        }

        fiche.querySelector('#ajouter').onclick = async () => {
          note = fiche.querySelector('#note').value.trim();
          voile.remove();
          try {
            await api('/api/orders/' + etat.orderId + '/items', {
              method: 'POST',
              body: JSON.stringify({
                product_id: article.id,
                qty_milli: quantite * 1000,
                course: service,
                note: note || null,
              }),
            });
            etat.lignes = await api('/api/orders/' + etat.orderId + '/items');
            dessinerCommande();
            message(quantite + ' × ' + article.name + ' ajouté', true);
          } catch (cause) {
            message(String(cause.message || cause));
          }
        };
      }

      function dessinerLignes() {
        ecran.innerHTML = '';
        if (etat.lignes.length === 0) {
          ecran.innerHTML =
            '<p class="vide">Commande vide.<br>Choisissez des plats dans la carte.</p>';
          dessinerActionsTable();
          return;
        }

        // Regroupé par service, dans l'ordre où la cuisine travaille.
        for (const service of SERVICES) {
          const lignes = etat.lignes.filter((l) => l.course === service.valeur);
          if (lignes.length === 0) continue;

          const servis = lignes.filter((l) => l.delivered).length;
          const envoyes = lignes.filter((l) => l.sent).length;

          // Avancement du service : « les entrées sont servies, les plats sont
          // en cuisine ». C'est ce qu'on lit en passant devant la table.
          const entete = document.createElement('div');
          entete.className = 'avancement';
          entete.innerHTML =
            '<span class="service" style="margin:0">' +
            service.nom +
            ' ' +
            servis +
            '/' +
            lignes.length +
            '</span><span class="barre-fond"><span class="barre-part" style="width:' +
            Math.round((servis / lignes.length) * 100) +
            '%"></span></span>';

          // Servir tout un service d'un geste : c'est ainsi qu'on repose un
          // plateau, pas assiette par assiette.
          if (envoyes > servis) {
            const tout = document.createElement('button');
            tout.type = 'button';
            tout.className = 'servir';
            tout.textContent = 'Tout servir';
            tout.onclick = () => void servir({ course: service.valeur });
            entete.append(tout);
          }
          ecran.append(entete);

          for (const ligne of lignes) {
            const bloc = document.createElement('div');
            bloc.className = 'ligne';
            bloc.innerHTML =
              '<div class="qte">' +
              ligne.qtyMilli / 1000 +
              '</div><div class="corps"><div style="font-weight:650">' +
              echapper(ligne.name) +
              '</div>' +
              (ligne.note ? '<div class="note">▸ ' + echapper(ligne.note) + '</div>' : '') +
              '<div class="etat ' +
              (ligne.delivered ? 'servi' : ligne.sent ? 'parti' : 'attente') +
              '">' +
              (ligne.delivered
                ? '● servi à table'
                : ligne.sent
                  ? '◐ en cuisine'
                  : '○ pas encore envoyé') +
              '</div></div>';

            // Le bouton de service est la seule action fréquente : large, à
            // droite, loin de la suppression.
            if (ligne.sent) {
              const bouton = document.createElement('button');
              bouton.type = 'button';
              if (ligne.delivered) {
                bouton.className = 'servi-fait';
                bouton.textContent = '✓ servi';
                bouton.title = 'Annuler la livraison';
                bouton.onclick = () => void annulerService(ligne);
              } else {
                bouton.className = 'servir';
                bouton.textContent = 'Servir';
                bouton.onclick = () => void servir({ itemIds: [ligne.id] });
              }
              bloc.append(bouton);
            }

            const supprimer = document.createElement('button');
            supprimer.type = 'button';
            supprimer.className = 'supprimer';
            supprimer.textContent = '✕';
            supprimer.onclick = async () => {
              // Un plat déjà parti en cuisine a été cuisiné : son retrait doit
              // s'expliquer, exactement comme sur la caisse.
              const motif = ligne.sent ? prompt('Motif de l’annulation ?') : '';
              if (ligne.sent && !motif) return;
              try {
                await api('/api/orders/' + etat.orderId + '/items/' + ligne.id, {
                  method: 'DELETE',
                  body: JSON.stringify({ reason: motif }),
                });
                etat.lignes = await api('/api/orders/' + etat.orderId + '/items');
                dessinerCommande();
              } catch (cause) {
                message(String(cause.message || cause));
              }
            };
            bloc.append(supprimer);
            ecran.append(bloc);
          }
        }

        dessinerActionsTable();
      }

      /** Libérer et transférer : les deux gestes de fin et de milieu de service. */
      function dessinerActionsTable() {
        if (!etat.table) return;

        const actions = document.createElement('div');
        actions.className = 'actions-table';

        const transferer = document.createElement('button');
        transferer.type = 'button';
        transferer.className = 'btn';
        transferer.textContent = 'Changer de table';
        transferer.onclick = () => void ficheTransfert();

        const liberer = document.createElement('button');
        liberer.type = 'button';
        liberer.className = 'btn danger';
        liberer.textContent = 'Libérer la table';
        liberer.onclick = () => libererTable();

        actions.append(transferer, liberer);
        ecran.append(actions);
      }

      async function servir(cible) {
        try {
          const resultat = await api('/api/orders/' + etat.orderId + '/deliver', {
            method: 'POST',
            body: JSON.stringify(cible),
          });
          etat.lignes = await api('/api/orders/' + etat.orderId + '/items');
          dessinerCommande();
          if (resultat.delivered > 0) {
            message(resultat.delivered + ' article(s) servi(s)', true);
          }
        } catch (cause) {
          message(String(cause.message || cause));
        }
      }

      /**
       * Défait une livraison saisie par erreur.
       *
       * Renvoyer le serveur vers la caisse pour corriger une faute de dix
       * secondes le pousserait à ne plus rien consigner du tout.
       */
      async function annulerService(ligne) {
        if (!confirm('Marquer « ' + ligne.name + ' » comme NON servi ?')) return;
        try {
          await api('/api/orders/' + etat.orderId + '/deliver', {
            method: 'POST',
            body: JSON.stringify({ item_ids: [ligne.id], undo: true }),
          });
          etat.lignes = await api('/api/orders/' + etat.orderId + '/items');
          dessinerCommande();
        } catch (cause) {
          message(String(cause.message || cause));
        }
      }

      function libererTable() {
        const nonServis = etat.lignes.filter((l) => !l.delivered).length;

        const voile = document.createElement('div');
        voile.className = 'voile';
        voile.onclick = (event) => {
          if (event.target === voile) voile.remove();
        };

        const fiche = document.createElement('div');
        fiche.className = 'fiche';
        fiche.innerHTML =
          '<div class="poignee"></div>' +
          '<div style="font-size:20px;font-weight:700">Libérer la table</div>' +
          '<div style="color:var(--gris);margin:6px 0 14px">' +
          (nonServis > 0
            ? '⚠ ' + nonServis + ' article(s) non servis seront annulés.'
            : 'La table redevient libre pour le client suivant.') +
          '</div>';

        for (const motif of MOTIFS) {
          const bouton = document.createElement('button');
          bouton.type = 'button';
          bouton.className = 'btn';
          bouton.style.marginBottom = '8px';
          bouton.textContent = motif.nom;
          bouton.onclick = async () => {
            voile.remove();
            try {
              const resultat = await api('/api/orders/' + etat.orderId + '/release', {
                method: 'POST',
                body: JSON.stringify({ reason: motif.valeur }),
              });
              message(
                resultat.cancelled > 0
                  ? 'Table libérée · ' + resultat.cancelled + ' article(s) annulé(s)'
                  : 'Table libérée',
                true,
              );
              salle();
            } catch (cause) {
              message(String(cause.message || cause));
            }
          };
          fiche.append(bouton);
        }

        voile.append(fiche);
        document.body.append(voile);
      }

      async function ficheTransfert() {
        const tables = await api('/api/tables');
        const libres = tables.filter((t) => !t.orderId && t.id !== etat.table.id);
        if (libres.length === 0) {
          message('Aucune table libre.');
          return;
        }

        const voile = document.createElement('div');
        voile.className = 'voile';
        voile.onclick = (event) => {
          if (event.target === voile) voile.remove();
        };

        const fiche = document.createElement('div');
        fiche.className = 'fiche';
        fiche.innerHTML =
          '<div class="poignee"></div><div style="font-size:20px;font-weight:700">' +
          'Déplacer vers…</div><div style="color:var(--gris);margin:4px 0 14px">' +
          'La commande suit les clients qui changent de place.</div>';

        const grille = document.createElement('div');
        grille.className = 'grille-tables';
        for (const table of libres) {
          const bouton = document.createElement('button');
          bouton.type = 'button';
          bouton.className = 'table';
          bouton.innerHTML =
            '<div class="nom">' +
            echapper(table.name) +
            '</div><div class="libre">' +
            table.seats +
            ' couverts</div>';
          bouton.onclick = async () => {
            voile.remove();
            try {
              await api('/api/orders/' + etat.orderId + '/move', {
                method: 'POST',
                body: JSON.stringify({ table_id: table.id }),
              });
              etat.table = table;
              dessinerCommande();
              message('Commande déplacée vers ' + table.name, true);
            } catch (cause) {
              message(String(cause.message || cause));
            }
          };
          grille.append(bouton);
        }
        fiche.append(grille);
        voile.append(fiche);
        document.body.append(voile);
      }

      async function envoyerCuisine() {
        try {
          const resultat = await api('/api/orders/' + etat.orderId + '/send', {
            method: 'POST',
            body: JSON.stringify({}),
          });
          etat.lignes = await api('/api/orders/' + etat.orderId + '/items');
          dessinerCommande();
          message(resultat.sent + ' article(s) envoyé(s) en cuisine', true);
        } catch (cause) {
          message(String(cause.message || cause));
        }
      }

      connexion();
    </script>
  </body>
</html>
