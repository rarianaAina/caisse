[package]
name = "caisse"
version = "0.2.0"
description = "Logiciel de caisse hors-ligne"
authors = ["Caisse"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nom du crate exposé à main.rs ; les trois types sont requis par Tauri v2.
name = "caisse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Base locale : SQLite embarquée, migrations déclarées côté Rust.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Version alignée sur celle de tauri-plugin-sql : les types de pool doivent
# être identiques pour pouvoir ouvrir une transaction sur SON pool.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Mise à jour de l'application, et redémarrage après installation.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Serveur local pour les téléphones des serveurs de salle (module 15).
axum = "0.8.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net"] }
# Vérification du PIN côté serveur, au MÊME format que celui produit par la
# WebView : `pbkdf2-sha256$<itérations>$<sel>$<empreinte>`. Sans cela, un
# serveur de salle devrait avoir un mot de passe distinct de celui de la caisse.
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
hmac = { version = "0.12.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
rand = { version = "0.9.5", default-features = false, features = ["thread_rng"] }

# Uniquement sur Windows : accès au spouleur pour l'impression brute.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  # `OpenPrinterW` est la SEULE fonction du spouleur conditionnée par cette
  # fonctionnalité (vérifié dans le source du crate : `#[cfg(feature =
  # "Win32_Graphics_Gdi")]` juste au-dessus de sa déclaration). Sans elle, la
  # compilation Windows échoue sur ce seul symbole — et Windows est le seul
  # endroit où ce module est compilé.
  "Win32_Graphics_Gdi",
] }

[profile.release]
# Un binaire de caisse est distribué sur des postes modestes : on optimise la taille.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
